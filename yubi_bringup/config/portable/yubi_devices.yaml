# Portable — overlay onto common/yubi_devices.yaml
# Adds: center_camera (USB cam replacing RealSense), footpedal_node (episode
# start/accept/reject/cancel input — hands stay on the grippers), and
# task_command_dispatch_node (button mapping, shared across footpedal /
# gripper double-click / Quest controller inputs since all three publish the
# same 3-button layout).

center_camera/usb_cam:
  ros__parameters:
    video_device: "/dev/yubi_center_camera"
    framerate: 60.0
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    camera_name: "center_camera"
    frame_id: "center_camera_optical_frame"
    controls:
      brightness: 50
      white_balance_automatic: true
      auto_exposure: 3

left_camera/usb_cam:
  ros__parameters:
    video_device: "/dev/yubi_left_camera"
    framerate: 60.0
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    camera_name: "left_camera"
    frame_id: "left_camera_optical_frame"
    controls:
      brightness: 50
      white_balance_automatic: true
      auto_exposure: 3

right_camera/usb_cam:
  ros__parameters:
    video_device: "/dev/yubi_right_camera"
    framerate: 60.0
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    camera_name: "right_camera"
    frame_id: "right_camera_optical_frame"
    controls:
      brightness: 50
      white_balance_automatic: true
      auto_exposure: 3

footpedal_node:
  ros__parameters: {}

task_command_dispatch_node:
  ros__parameters:
    # Default portable input source is /footpedal_states (see joy_remap_topic
    # in yubi_data_collection.launch.py) — footpedal_node publishes 3 buttons
    # keyed by the pedal's raw HID switch code, not physical left/right
    # position. Run `ros2 run yubi_bringup identify_footpedal` and press each
    # pedal individually to confirm which index below corresponds to which
    # physical pedal before relying on this mapping.
    #
    # /portable_joy_command (gripper double-click + Quest controller buttons,
    # see yubi_bringup/portable_joy_command_node.py) uses the same button
    # layout and remains available via joy_remap_topic:=/portable_joy_command.
    joy_accept_button: 2
    joy_reject_button: 1
    joy_cancel_episode_button: 0
    joy_rewind_button: -1


# Presence markers — spawn the per-gripper double-click detector and the
# aggregator that publishes /portable_joy_command (consumed by
# task_command_dispatch_node via the joy_remap_topic launch arg).
gripper_double_click_node:
  ros__parameters: {}

portable_joy_command_node:
  ros__parameters: {}
