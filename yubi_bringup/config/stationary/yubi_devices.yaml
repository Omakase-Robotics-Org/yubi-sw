# Stationary (yagura) — overlay onto common/yubi_devices.yaml
# Adds: footpedal_node (presence marker), task_command_dispatch_node (footpedal
# button mapping), /camera/camera (RealSense head camera).

footpedal_node:
  ros__parameters: {}

task_command_dispatch_node:
  ros__parameters:
    # footpedal_node numbers buttons by the pedal's raw HID switch code, not
    # left/right position — verify per-unit with
    # `ros2 run yubi_bringup identify_footpedal` (see config/portable/yubi_devices.yaml
    # for the yubi1 footswitch's confirmed right/center/left mapping).
    # joy_source_topic is intentionally NOT set here: unset means the
    # footpedal (/footpedal_states), which is what a yagura stationary box
    # uses. A stationary box that drives the task state machine from the
    # gripper double-click instead sets it in config/local/ -- see
    # deploy/yubi1/config-local/yubi_devices.yaml. Declaring
    # portable_joy_command_node also flips it, so the two cannot disagree.
    joy_accept_button: 2
    joy_reject_button: 1
    joy_cancel_episode_button: 0
    joy_rewind_button: -1

/camera/camera:
  ros__parameters:
    enable_color: true
    rgb_camera.color_profile: "640x480x30"
    enable_depth: false
    align_depth.enable: false
    enable_sync: true
    publish_tf: true
    tf_publish_rate: 1.0
